name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - 'design/**'
      - 'spec/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'design/**'
      - 'spec/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      # Temporary: remove after importing this run's generated lockfiles.
      - name: Generate updated lockfiles
        run: |
          dotnet restore Cadence.sln --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore Cadence.Tray -r win-x64 -p:PublishSingleFile=true --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export updated lockfiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-updated-lockfiles
          path: |
            windows/**/packages.lock.json
            windows/Cadence.Tray/PublishLocks/*.json
          if-no-files-found: error
      - name: Restore locked dependencies
        run: dotnet restore Cadence.sln --locked-mode
      - name: Build
        run: dotnet build Cadence.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Cadence.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: windows/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Restore pinned packaging tool
        run: |
          $tool = (Get-Content .config/dotnet-tools.json | ConvertFrom-Json).tools.vpk.version
          $package = ([xml](Get-Content Cadence.Tray/Cadence.Tray.csproj)).SelectSingleNode('//PackageReference[@Include="Velopack"]').Version
          if ($tool -ne $package) { throw 'Velopack package and tool versions must match.' }
          dotnet tool restore
      - name: Publish preview with locked dependencies
        run: dotnet publish Cadence.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:RestoreLockedMode=true "-p:Version=0.0.0-ci.$env:GITHUB_RUN_NUMBER"
      - name: Check publish contents
        run: ./scripts/Assert-PublishContents.ps1 -Path Cadence.Tray/bin/Release/net8.0-windows/win-x64/publish
      - name: Pack installer and update packages (no upload)
        run: dotnet vpk pack --packId Cadence --packVersion "0.0.0-ci.$env:GITHUB_RUN_NUMBER" --packDir Cadence.Tray/bin/Release/net8.0-windows/win-x64/publish --mainExe Cadence.Tray.exe --channel win --outputDir Releases --noPortable
      - name: Upload installer preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-windows-installer-preview
          path: windows/Releases/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-windows-win-x64
          path: windows/Cadence.Tray/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 14
      - name: Render synthetic design previews
        run: dotnet run --project Cadence.Tray -c Release --no-build --no-restore -- --design-preview design-preview
      - name: Upload design previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-design-preview
          path: windows/design-preview/*.png
          if-no-files-found: error
          retention-days: 14
