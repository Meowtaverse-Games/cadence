name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - 'spec/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'spec/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore locked dependencies
        run: dotnet restore Cadence.sln --locked-mode
      - name: Build
        run: dotnet build Cadence.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Cadence.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=core.trx" --logger "console;verbosity=normal"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: windows/**/TestResults/*.trx
          if-no-files-found: ignore
