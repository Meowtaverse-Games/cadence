name: Windows Release

on:
  push:
    tags: ['windows-v*']

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  pack:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^windows-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Expected windows-vX.Y.Z (stable SemVer without leading zeros).'
          }
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(9))" >> $env:GITHUB_ENV
          "version=$($env:RELEASE_TAG.Substring(9))" >> $env:GITHUB_OUTPUT
      - name: Restore locked dependencies
        run: dotnet restore Cadence.sln --locked-mode
      - name: Build
        run: dotnet build Cadence.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Cadence.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-test-results
          path: windows/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Restore pinned packaging tool
        run: |
          $tool = (Get-Content .config/dotnet-tools.json | ConvertFrom-Json).tools.vpk.version
          $package = ([xml](Get-Content Cadence.Tray/Cadence.Tray.csproj)).SelectSingleNode('//PackageReference[@Include="Velopack"]').Version
          if ($tool -ne $package) { throw 'Velopack package and tool versions must match.' }
          dotnet tool restore
      - name: Publish with locked dependencies
        run: dotnet publish Cadence.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:RestoreLockedMode=true "-p:Version=$env:RELEASE_VERSION"
      - name: Check publish contents
        run: ./scripts/Assert-PublishContents.ps1 -Path Cadence.Tray/bin/Release/net8.0-windows/win-x64/publish
      - name: Smoke test published release
        run: ./scripts/Test-PackagedStartup.ps1 -Path Cadence.Tray/bin/Release/net8.0-windows/win-x64/publish -ExpectedVersion "$env:RELEASE_VERSION"
      - name: Check publish contents after smoke test
        run: ./scripts/Assert-PublishContents.ps1 -Path Cadence.Tray/bin/Release/net8.0-windows/win-x64/publish
      - name: Download previous release for delta generation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Only an empty stable Windows release history is a first release.
          # API/network/download errors must fail instead of silently losing deltas.
          $releases = @()
          $page = 1
          do {
            $batch = @(Invoke-RestMethod "https://api.github.com/repos/Meowtaverse-Games/cadence/releases?per_page=100&page=$page" -Headers @{ 'User-Agent' = 'Cadence-release-ci'; Authorization = "Bearer $env:GITHUB_TOKEN" })
            $releases += $batch
            $page++
          } while ($batch.Count -eq 100)
          $previous = @($releases | Where-Object { !$_.draft -and !$_.prerelease -and $_.tag_name -cmatch '^windows-v' -and $_.assets.name -contains 'releases.win.json' })
          if ($previous.Count -gt 0) {
            dotnet vpk download github --repoUrl https://github.com/Meowtaverse-Games/cadence --token "$env:GITHUB_TOKEN" --channel win --outputDir Releases
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'No previous stable Windows release; creating the first full package.'
          }
      - name: Pack installer and update packages
        run: dotnet vpk pack --runtime win-x64 --packId Cadence --packVersion "$env:RELEASE_VERSION" --packDir Cadence.Tray/bin/Release/net8.0-windows/win-x64/publish --mainExe Cadence.Tray.exe --channel win --outputDir Releases --noPortable
      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-packages
          path: windows/Releases/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    steps:
      # Checkout only SDK/tool manifests; never build or test repository code here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            windows/.config
            windows/global.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/global.json
      - name: Restore pinned upload tool
        run: dotnet tool restore
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-packages
          path: windows/Releases
      - name: Publish GitHub release for the approved tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.pack.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: dotnet vpk upload github --repoUrl https://github.com/Meowtaverse-Games/cadence --token "$env:GITHUB_TOKEN" --tag "$env:RELEASE_TAG" --releaseName "Windows $env:RELEASE_VERSION" --channel win --outputDir Releases --publish
