name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - 'spec/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'spec/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show pinned Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test CadenceCore (debug)
        working-directory: ios/CadenceCore
        run: swift test

  app:
    strategy:
      fail-fast: false
      matrix:
        firebase-config: [absent, synthetic]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show pinned Xcode version and export methods
        run: |
          xcodebuild -version
          python3 - <<'PYHELP'
          import subprocess
          help_text = subprocess.run(["xcodebuild", "-help"], capture_output=True, text=True, check=True)
          text = help_text.stdout + help_text.stderr
          section = text.split("method : String", 1)[1].lstrip().split("\n\n", 1)[0]
          print(section)
          assert "debugging" in section and "development" in section
          PYHELP
      - name: Install XcodeGen 2.44.1 from verified official release
        env:
          XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
        run: |
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Prepare optional synthetic Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ matrix.firebase-config }}
        run: |
          test ! -e ios/GoogleService-Info.plist
          if [[ "$FIREBASE_CONFIG" == synthetic ]]; then
            python3 - <<'PYPLIST'
          import plistlib
          from pathlib import Path
          values = {
              "PROJECT_ID": "demo-cadence", "BUNDLE_ID": "com.meowtaverse-games.cadence",
              "GOOGLE_APP_ID": "1:000000000000:ios:0000000000000000000000",
              "GCM_SENDER_ID": "000000000000", "API_KEY": "synthetic-not-a-real-api-key",
              "PLIST_VERSION": "1", "IS_ANALYTICS_ENABLED": False,
          }
          Path("ios/GoogleService-Info.plist").write_bytes(plistlib.dumps(values))
          PYPLIST
            plutil -lint ios/GoogleService-Info.plist
          fi
      - name: Generate project
        run: |
          xcodegen --version
          ios/scripts/generate-project.sh
      - name: Resolve packages only when the committed lock is missing
        if: hashFiles('ios/Package.resolved') == ''
        run: >-
          xcodebuild -resolvePackageDependencies
          -project ios/Cadence.xcodeproj -scheme Cadence
      - name: Upload resolved packages for committing
        if: hashFiles('ios/Package.resolved') == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-package-resolved-${{ matrix.firebase-config }}
          path: ios/Cadence.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 14
      - name: Require committed package lock
        run: |
          if [[ ! -f ios/Package.resolved ]]; then
            echo '::error::ios/Package.resolved がありません。artifact を取得して ios/Package.resolved としてコミットしてください。'
            exit 1
          fi
      - name: Build unsigned simulator app and extensions with locked package resolution
        run: >-
          xcodebuild build
          -project ios/Cadence.xcodeproj
          -scheme Cadence
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/CadenceDerivedData"
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
      - name: Verify Firebase configuration packaging
        env:
          FIREBASE_CONFIG: ${{ matrix.firebase-config }}
        run: |
          plist="$RUNNER_TEMP/CadenceDerivedData/Build/Products/Debug-iphonesimulator/Cadence.app/GoogleService-Info.plist"
          if [[ "$FIREBASE_CONFIG" == synthetic ]]; then
            test -f "$plist"
            plutil -lint "$plist"
          else
            test ! -e "$plist"
          fi
      - name: Verify both extensions are embedded and contain no Firebase
        run: |
          app="$RUNNER_TEMP/CadenceDerivedData/Build/Products/Debug-iphonesimulator/Cadence.app"
          test -d "$app/PlugIns/DeviceActivityMonitor.appex"
          test -d "$app/PlugIns/ShieldConfiguration.appex"
          for extension in DeviceActivityMonitor ShieldConfiguration; do
            bundle="$app/PlugIns/$extension.appex"
            test ! -d "$bundle/Frameworks"
            # Include the debug dylib, when Xcode emits one, as well as the executable.
            for binary in "$bundle/$extension" "$bundle"/*.dylib; do
              [[ -f "$binary" ]] || continue
              nm -a "$binary" > "$RUNNER_TEMP/extension-symbols.txt"
              otool -L "$binary" > "$RUNNER_TEMP/extension-libraries.txt"
              if grep -Ei 'firebase|firestore|FIRApp|FIRAuth|FIRFirestore' "$RUNNER_TEMP/extension-symbols.txt" "$RUNNER_TEMP/extension-libraries.txt"; then
                echo '::error::Firebase was linked into an extension'
                exit 1
              fi
            done
          done

  design-preview:
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen 2.44.1 from verified official release
        env:
          XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
        run: |
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project without Firebase configuration
        run: |
          test ! -e ios/GoogleService-Info.plist
          ios/scripts/generate-project.sh
          test -f ios/Package.resolved
      - name: Build preview app with locked packages
        run: >-
          xcodebuild build
          -project ios/Cadence.xcodeproj -scheme Cadence -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/CadenceDerivedData"
          -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO
      - name: Launch synthetic screens and capture screenshots
        run: |
          python3 - <<'PYSIM'
          import json, os, subprocess
          from pathlib import Path
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          devices = json.loads(run("xcrun", "simctl", "list", "devices", "available", "--json"))
          device = next(d for group in devices["devices"].values() for d in group if d["name"].startswith("iPhone"))
          udid = device["udid"]
          if device["state"] != "Booted":
              run("xcrun", "simctl", "boot", udid)
          run("xcrun", "simctl", "bootstatus", udid, "-b")
          run("xcrun", "simctl", "status_bar", udid, "override", "--time", "20:31", "--batteryState", "charged", "--batteryLevel", "100")
          app = Path(os.environ["RUNNER_TEMP"]) / "CadenceDerivedData/Build/Products/Debug-iphonesimulator/Cadence.app"
          run("xcrun", "simctl", "install", udid, str(app))
          output = Path(os.environ["RUNNER_TEMP"]) / "ios-design-preview"
          output.mkdir()
          import time
          for screen in ["home-focus", "home-free", "home-idle", "editor", "first-link", "sync", "shield"]:
              subprocess.run(["xcrun", "simctl", "terminate", udid, "com.meowtaverse-games.cadence"], check=False)
              run("xcrun", "simctl", "launch", udid, "com.meowtaverse-games.cadence", "-CadenceDesignPreview", screen)
              time.sleep(3)
              run("xcrun", "simctl", "io", udid, "screenshot", str(output / (screen + ".png")))
          PYSIM
      - name: Upload design preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-design-preview
          path: ${{ runner.temp }}/ios-design-preview/*.png
          if-no-files-found: error
          retention-days: 14
