name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'spec/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'spec/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true
      # Sign debug APKs with a fixed key so testers can update in place without
      # uninstalling (which wipes on-device data). The key lives only in the
      # repository secret; when it is unavailable (for example, PRs from forks),
      # AGP generates a throwaway debug key as before.
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "- Debug keystore: secret unavailable, using a generated key" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fingerprint=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p')
          echo "- Debug keystore: fixed key, certificate SHA-256 \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Test, lint, and build debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Summarize JUnit results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for module, task in [('core', 'test'), ('app', 'testDebugUnitTest')]:
                  files = list(Path(module, 'build/test-results', task).glob('TEST-*.xml'))
                  counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
                  for file in files:
                      suite = ET.parse(file).getroot()
                      for key in counts:
                          counts[key] += int(suite.get(key, '0'))
                  summary.write(f'- :{module}:{task}: {counts} ({len(files)} XML files)\n')
          PYTEST
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results
          path: android/**/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
