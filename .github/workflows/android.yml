name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'spec/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'spec/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true
      # Sign debug APKs with a fixed key so testers can update in place without
      # uninstalling (which wipes on-device data). The key lives only in the
      # repository secret; when it is unavailable (for example, PRs from forks),
      # AGP generates a throwaway debug key as before.
      - name: Install fixed debug keystore
        id: debug_keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "- Debug keystore: secret unavailable, using a generated key" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          # Pin AGP's keystore location instead of relying on its default lookup.
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          if ! listing=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>&1); then
            echo "::error::Could not read the debug keystore: $(printf '%s' "$listing" | grep -i 'error' | head -n 1)"
            exit 1
          fi
          fingerprint=$(printf '%s\n' "$listing" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$fingerprint" ]; then
            echo "::error::Could not find the SHA-256 certificate fingerprint in the debug keystore listing"
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "- Debug keystore: fixed key, certificate SHA-256 \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Test, lint, and build debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Verify debug APK is signed with the fixed key
        if: steps.debug_keystore.outputs.fingerprint != ''
        env:
          EXPECTED_FINGERPRINT: ${{ steps.debug_keystore.outputs.fingerprint }}
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/debug/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            # The signer label varies by apksigner version and scheme, e.g.
            # "Signer #1 certificate ...", "Signer (minSdkVersion=...) certificate ..."
            # or "V2 Signer: certificate ...". Source stamp lines are excluded.
            actual=$(printf '%s\n' "$certs" | sed -n '/^Source Stamp/d; s/^.*Signer.* certificate SHA-256 digest: //p' | sort -u)
            if [ "$actual" != "$EXPECTED_FINGERPRINT" ]; then
              printf '%s\n' "$certs"
              echo "::error::$apk is not signed only with the fixed debug key (found: ${actual:-none})"
              exit 1
            fi
            echo "$apk: signed with the fixed debug key"
          done
      - name: Summarize JUnit results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for module, task in [('core', 'test'), ('app', 'testDebugUnitTest')]:
                  files = list(Path(module, 'build/test-results', task).glob('TEST-*.xml'))
                  counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
                  for file in files:
                      suite = ET.parse(file).getroot()
                      for key in counts:
                          counts[key] += int(suite.get(key, '0'))
                  summary.write(f'- :{module}:{task}: {counts} ({len(files)} XML files)\n')
          PYTEST
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results
          path: android/**/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadence-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      # Run only after the configuration-free APK has been built and uploaded.
      - name: Check google-services plugin with synthetic configuration
        run: |
          set -euo pipefail
          test ! -e app/google-services.json
          before=$(sha256sum app/build/outputs/apk/debug/*.apk)
          trap 'rm -f app/google-services.json; rm -rf app/build/generated/res app/build/gmpAppId' EXIT
          python3 - <<'PYSYNTHETIC'
          import json
          from pathlib import Path
          config = {
              "project_info": {"project_number": "000000000000", "project_id": "demo-cadence"},
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                      "android_client_info": {"package_name": "com.meowtaversegames.cadence"}
                  },
                  "api_key": [{"current_key": "synthetic-dummy-key-not-valid"}]
              }],
              "configuration_version": "1"
          }
          Path("app/google-services.json").write_text(json.dumps(config))
          PYSYNTHETIC
          ./gradlew :app:processDebugGoogleServices --no-daemon
          python3 - <<'PYRESOURCE'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          # AGP chooses the generated-source directory; do not hard-code the plugin's old path.
          matches = [element for file in Path("app/build/generated/res").rglob("values.xml")
                     for element in ET.parse(file).getroot()
                     if element.tag == "string" and element.get("name") == "google_app_id"]
          assert len(matches) == 1 and matches[0].text == "1:000000000000:android:0000000000000000000000"
          print("Synthetic Firebase resource verified.")
          PYRESOURCE
          after=$(sha256sum app/build/outputs/apk/debug/*.apk)
          test "$before" = "$after"
