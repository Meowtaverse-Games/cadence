name: Cadence
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '16.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.2.0
  CadenceCore:
    path: CadenceCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: Cadence
      - path: Shared
      # XcodeGen's optional single-file source still creates a build input when absent.
      # Enumerate only an existing plist while keeping this source optional.
      - path: .
        includes:
          - GoogleService-Info.plist
        optional: true
        buildPhase: resources
    entitlements:
      path: Cadence/Cadence.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.meowtaverse-games.cadence]
    info:
      path: Cadence/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Cadence
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.meowtaverse-games.cadence.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowtaverse-games.cadence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: CadenceCore
      - target: DeviceActivityMonitor
        embed: true
      - target: ShieldConfiguration
        embed: true
  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitor
      - path: Shared
    entitlements:
      path: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.meowtaverse-games.cadence]
    info:
      path: DeviceActivityMonitor/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowtaverse-games.cadence.DeviceActivityMonitor
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: CadenceCore
  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfiguration
      - path: Shared/GroupStore.swift
      - path: Shared/LocalTimetable.swift
      - path: Shared/CadenceMark.swift
    entitlements:
      path: ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.meowtaverse-games.cadence]
    info:
      path: ShieldConfiguration/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowtaverse-games.cadence.ShieldConfiguration
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: CadenceCore
schemes:
  Cadence:
    build:
      targets:
        Cadence: all
