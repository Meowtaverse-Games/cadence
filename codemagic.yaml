workflows:
  ios-development:
    name: iOS 開発用署名（実機確認）
    instance_type: mac_mini_m2
    max_build_duration: 60
    # No triggering or publishing: start manually; do not upload to TestFlight.
    environment: &ios-environment
      xcode: '26.6'
      groups:
        - cadence_apple
      vars:
        XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
    scripts:
      - &restore-firebase
        name: Restore Firebase configuration from secret
        script: |
          set +x
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]]; then
            echo 'cadence_apple グループに GOOGLE_SERVICE_INFO_PLIST_BASE64 を Secret として登録してください。'
            exit 1
          fi
          python3 - <<'PYPLIST'
          import base64
          import os
          from pathlib import Path
          Path("ios/GoogleService-Info.plist").write_bytes(
              base64.b64decode(os.environ["GOOGLE_SERVICE_INFO_PLIST_BASE64"], validate=True))
          PYPLIST
          plutil -lint ios/GoogleService-Info.plist
      - &generate-ios-project
        name: Install verified XcodeGen 2.44.1
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/.ci-tools"
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$CM_BUILD_DIR/.ci-tools/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $CM_BUILD_DIR/.ci-tools/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$CM_BUILD_DIR/.ci-tools/xcodegen.zip" -d "$CM_BUILD_DIR/.ci-tools"
          export PATH="$CM_BUILD_DIR/.ci-tools/xcodegen/bin:$PATH"
          xcodebuild -version
          xcodegen --version
          ios/scripts/generate-project.sh
      - name: Fetch development profiles for all three identifiers
        script: |
          set -euo pipefail
          keychain initialize
          for bundle_id in com.meowtaverse-games.cadence com.meowtaverse-games.cadence.DeviceActivityMonitor com.meowtaverse-games.cadence.ShieldConfiguration; do
            app-store-connect fetch-signing-files "$bundle_id" --type IOS_APP_DEVELOPMENT --strict-match-identifier --create
          done
          keychain add-certificates
          xcode-project use-profiles --project ios/Cadence.xcodeproj --archive-method development --export-options-plist "$CM_BUILD_DIR/export_options.plist"
      - name: Build development IPA with locked package resolution
        script: |
          set -euo pipefail
          mkdir -p build/logs
          xcode-project build-ipa --project ios/Cadence.xcodeproj --scheme Cadence --config Release --archive-flags='-onlyUsePackageVersionsFromResolvedFile' --export-options-plist "$CM_BUILD_DIR/export_options.plist" 2>&1 | tee build/logs/ios-development.log
      - &verify-firebase-ipa
        name: Verify Firebase configuration is embedded in the IPA
        script: |
          set -euo pipefail
          python3 - <<'PYIPA'
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path("build/ios/ipa").glob("*.ipa"))
          assert archives, "IPA がありません"
          for archive in archives:
              with ZipFile(archive) as ipa:
                  assert "Payload/Cadence.app/GoogleService-Info.plist" in ipa.namelist(), "IPA に Firebase の設定がありません"
          print("IPA 内の Firebase 設定ファイルを確認しました。")
          PYIPA
    artifacts: &ios-artifacts
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
  ios-release:
    name: iOS TestFlight 内部テスト
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Start manually. Export restricts this build to internal TestFlight testing.
    environment: *ios-environment
    scripts:
      - name: Check TestFlight secrets
        script: |
          set +x
          set -euo pipefail
          for variable in APP_STORE_APP_ID TESTFLIGHT_BETA_GROUP; do
            value="${!variable:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "docs/apple-setup.md の手順11に従い、cadence_apple に $variable を Secret として登録してください。"
              exit 1
            fi
          done
      - *restore-firebase
      - *generate-ios-project
      - name: Select the next TestFlight build number
        script: |
          set +x
          set -euo pipefail
          python3 ios/scripts/testflight-build-number.py
      - name: Fetch App Store profiles for all three identifiers
        script: |
          set +x
          set -euo pipefail
          # Suppress CLI output that can contain certificate/profile account metadata.
          keychain initialize >/dev/null 2>&1 || { echo '一時キーチェーンの初期化に失敗しました。'; exit 1; }
          for bundle_id in com.meowtaverse-games.cadence com.meowtaverse-games.cadence.DeviceActivityMonitor com.meowtaverse-games.cadence.ShieldConfiguration; do
            if ! app-store-connect fetch-signing-files "$bundle_id" --type IOS_APP_STORE --strict-match-identifier --create >/dev/null 2>&1; then
              echo "$bundle_id の App Store 用署名ファイルの取得に失敗しました。API キーの権限・配布用 capability・証明書の上限を非公開で確認してください。"
              exit 1
            fi
            echo "$bundle_id appStoreSigningFiles=true"
          done
          keychain add-certificates >/dev/null 2>&1 || { echo '証明書の取り込みに失敗しました。'; exit 1; }
          if ! xcode-project use-profiles --project ios/Cadence.xcodeproj --archive-method app-store --custom-export-options='{"testFlightInternalTestingOnly": true}' --export-options-plist "$CM_BUILD_DIR/export_options.plist" >/dev/null 2>&1; then
            echo 'App Store 用 profile の適用に失敗しました。3つの App ID と配布用 capability を確認してください。'
            exit 1
          fi
      - name: Build App Store IPA with a shared build number and locked packages
        script: |
          set +x
          set -euo pipefail
          mkdir -p build/logs
          # Command-line build settings override project AND target settings, including extensions.
          xcode-project build-ipa --project ios/Cadence.xcodeproj --scheme Cadence --config Release --archive-flags='-onlyUsePackageVersionsFromResolvedFile' --archive-xcargs="CURRENT_PROJECT_VERSION=$CADENCE_BUILD_NUMBER" --export-options-plist "$CM_BUILD_DIR/export_options.plist" 2>&1 | tee build/logs/ios-release.log
      - *verify-firebase-ipa
      - name: Verify release entitlements, profiles and build numbers before upload
        script: |
          set +x
          set -euo pipefail
          python3 ios/scripts/verify-release-ipa.py
    artifacts: *ios-artifacts
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - $TESTFLIGHT_BETA_GROUP
        submit_to_app_store: false
